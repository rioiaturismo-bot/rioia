<meta charset="utf-8">
<title>Rio IA by SOLVAM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: una pantalla vertical. Capa 1 = video a pantalla completa con WhatsApp siempre a la vista.
     Capa 2 = pantalla final (Rio IA, Soluções não problemas, FALE CONOSCO) que entra al terminar el video. */
  :root {
    --navy: #14384f;
    --navy-deep: #0b2233;
    --sand: #f5ece0;
    --panel: #325169;
    --orange: #f58a1f;
    --orange-press: #d9740f;
    --wa-ink: #1a1206;
    --display: "Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--navy-deep);
    color: var(--sand);
    font-family: var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    position: relative;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 18px;
    background: var(--navy-deep);
  }
  .layer { position: absolute; inset: 0; }

  /* ---------- Capa 1: video ---------- */
  #video { width: 100%; height: 100%; object-fit: cover; display: block; background: var(--navy-deep); }
  .scrim {
    position: absolute; left: 0; right: 0; bottom: 0; height: 34%;
    background: linear-gradient(to top, rgba(11,34,51,.82), rgba(11,34,51,0));
    pointer-events: none;
  }
  .brand-tag {
    position: absolute; top: 14px; left: 14px;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .02em;
    color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.55);
  }
  .brand-tag small { display: block; font-weight: 500; font-size: 10px; opacity: .85; letter-spacing: .06em; }
  .pin { width: 22px; height: 22px; flex: none; }
  .ctrl {
    position: absolute; top: 12px; right: 12px;
    display: flex; gap: 8px;
  }
  .chip {
    appearance: none; border: 0; cursor: pointer;
    min-height: 44px; min-width: 44px; padding: 0 14px;
    border-radius: 999px;
    background: rgba(11,34,51,.55);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: #fff; font: 700 13px/1 var(--body);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .chip:focus-visible, .cta:focus-visible, .lang a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .chip svg { width: 18px; height: 18px; }
  .video-cta {
    position: absolute; left: 16px; right: 16px; bottom: max(18px, env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center;
  }
  #tap {
    position: absolute; inset: 0; display: grid; place-items: center; background: rgba(11,34,51,.35);
  }
  #tap[hidden] { display: none; }
  #tap .chip { min-height: 72px; padding: 0 28px; font-size: 16px; background: var(--orange); color: var(--wa-ink); }

  /* ---------- CTA WhatsApp ---------- */
  .cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 56px; padding: 0 28px; border-radius: 999px;
    background: var(--orange); color: var(--wa-ink);
    font: 800 16px/1 var(--display); letter-spacing: .08em; text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(245,138,31,.35);
  }
  .cta:active { background: var(--orange-press); transform: translateY(1px); }
  .cta svg { width: 24px; height: 24px; flex: none; }
  .video-cta .cta { min-height: 52px; font-size: 14px; }

  /* ---------- Capa 2: pantalla final (igual a la página de Canva) ---------- */
  #final {
    opacity: 0; visibility: hidden; transition: opacity .7s ease, visibility 0s linear .7s;
    display: flex; flex-direction: column; background: var(--panel);
  }
  #app.done #final { opacity: 1; visibility: visible; transition-delay: 0s; }
  .hero {
    flex: 0 0 60%; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    text-align: center; padding: 20px;
    background: linear-gradient(rgba(8,24,38,.38), rgba(8,24,38,.55)), url(hero.jpg) 34% 50% / cover no-repeat;
  }
  .hero .logo { width: min(70%, 290px); height: auto; filter: drop-shadow(0 2px 14px rgba(0,0,0,.4)); }
  .slogan {
    margin: 0; font: 700 clamp(15px, 4.6vw, 19px)/1.25 var(--display);
    letter-spacing: .12em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.5);
  }
  .panel {
    flex: 1; min-height: 0; background: var(--panel);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    text-align: center; padding: 18px 24px max(18px, env(safe-area-inset-bottom, 0px));
  }
  .panel p { margin: 0; }
  .l1 { font: 400 clamp(20px, 6vw, 26px)/1.2 var(--body); }
  .l2 { font: 800 clamp(20px, 6vw, 26px)/1.2 var(--display); }
  .l3 { font-size: 14px; line-height: 1.45; opacity: .92; max-width: 32ch; text-wrap: balance; }
  .lang { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
  .lang[hidden] { display: none; }
  .lang a {
    min-height: 44px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center;
    border: 1.5px solid rgba(245,236,224,.5); color: var(--sand); text-decoration: none;
    font: 700 13px var(--body); letter-spacing: .06em;
  }
  .replay { background: transparent; border: 0; color: var(--sand); opacity: .7; font: 600 13px var(--body); min-height: 44px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .brand-logo { position: absolute; top: 12px; left: 14px; width: 92px; height: auto; filter: drop-shadow(0 1px 6px rgba(0,0,0,.55)); }

  @media (prefers-reduced-motion: reduce) { #final { transition: none; } }
</style>

<main id="app">
  <section class="layer" id="stage" aria-label="Video">
    <video id="video" muted playsinline webkit-playsinline preload="auto" poster="poster.jpg" aria-label="Rio de Janeiro con Rio IA">
      <source src="promo.mp4" type="video/mp4">
    </video>
    <div class="scrim"></div>
    <img class="brand-logo" src="logo.png" alt="Rio IA">
    <div class="ctrl">
      <button class="chip" id="sound" type="button" aria-label="Activar sonido">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path id="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <span id="soundTxt">Som</span>
      </button>
      <button class="chip" id="skip" type="button">Pular</button>
    </div>
    <div class="video-cta">
      <a class="cta wa" href="https://wa.me/message/FYT67YBV3P46I1" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.04 2a9.9 9.9 0 0 0-8.5 14.9L2 22l5.27-1.38A9.9 9.9 0 1 0 12.04 2Zm0 18.1a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-3.13.82.84-3.05-.2-.31a8.2 8.2 0 1 1 6.97 3.86Zm4.5-6.1c-.25-.12-1.46-.72-1.69-.8-.23-.09-.39-.12-.56.12-.16.25-.64.8-.78.97-.14.16-.29.18-.53.06a6.7 6.7 0 0 1-3.3-2.88c-.25-.43.25-.4.71-1.32.08-.16.04-.3-.02-.42-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.41-.56-.42h-.47c-.16 0-.43.06-.65.3-.23.25-.86.84-.86 2.05 0 1.2.88 2.37 1 2.54.12.16 1.72 2.63 4.18 3.69 1.55.67 2.16.73 2.94.62.47-.07 1.46-.6 1.66-1.18.2-.57.2-1.07.14-1.17-.06-.1-.23-.16-.48-.28Z"/></svg>
        Fale conosco
      </a>
    </div>
    <div id="tap" hidden>
      <button class="chip" id="tapBtn" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z"/></svg>
        Toque para ver
      </button>
    </div>
  </section>

  <section class="layer" id="final" aria-label="Rio IA">
    <div class="hero">
      <img class="logo" src="logo.png" alt="Rio IA">
      <p class="slogan">Soluções, não problemas.</p>
      <a class="cta wa" id="mainCta" href="https://wa.me/message/FYT67YBV3P46I1" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.04 2a9.9 9.9 0 0 0-8.5 14.9L2 22l5.27-1.38A9.9 9.9 0 1 0 12.04 2Zm0 18.1a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-3.13.82.84-3.05-.2-.31a8.2 8.2 0 1 1 6.97 3.86Zm4.5-6.1c-.25-.12-1.46-.72-1.69-.8-.23-.09-.39-.12-.56.12-.16.25-.64.8-.78.97-.14.16-.29.18-.53.06a6.7 6.7 0 0 1-3.3-2.88c-.25-.43.25-.4.71-1.32.08-.16.04-.3-.02-.42-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.41-.56-.42h-.47c-.16 0-.43.06-.65.3-.23.25-.86.84-.86 2.05 0 1.2.88 2.37 1 2.54.12.16 1.72 2.63 4.18 3.69 1.55.67 2.16.73 2.94.62.47-.07 1.46-.6 1.66-1.18.2-.57.2-1.07.14-1.17-.06-.1-.23-.16-.48-.28Z"/></svg>
        Fale conosco
      </a>
    </div>
    <div class="panel">
      <p class="l1">Muito mais que passeios.</p>
      <p class="l2">Seu melhor amigo no Rio.</p>
      <p class="l3">Atendimento personalizado, recomendações honestas e pessoas de confiança para ajudar você a viver o melhor do Rio.</p>
      <div class="lang" id="lang" hidden>
        <a href="#" data-l="es" target="_blank" rel="noopener">Español</a>
        <a href="#" data-l="en" target="_blank" rel="noopener">English</a>
        <a href="#" data-l="fr" target="_blank" rel="noopener">Français</a>
      </div>
      <button class="replay" id="replay" type="button">Ver o vídeo de novo</button>
    </div>
  </section>
</main>

<script>
(function () {
  // ===== CONFIG =====
  // Número de WhatsApp de la empresa, formato internacional sin + ni espacios (ej. "5521999999999").
  // Mientras esté vacío se usa el enlace wa.me/message/... y no se puede prellenar el mensaje con el código.
  var WA_NUMBER = "";
  var WA_FALLBACK = "https://wa.me/message/FYT67YBV3P46I1";
  var MSG = {
    pt: "Olá! Vim pelo parceiro {c} e quero ajuda para curtir o Rio.",
    es: "¡Hola! Vengo por el socio {c} y quiero ayuda para disfrutar Río.",
    en: "Hi! I came through partner {c} and I'd like help enjoying Rio.",
    fr: "Bonjour ! Je viens de la part du partenaire {c} et j'aimerais de l'aide à Rio."
  };

  // Código del punto de venta: tras # (ej. ...#IPA01) o ?p=IPA01
  function getCode() {
    var raw = (location.hash || "").replace(/^#/, "");
    if (!raw) { try { raw = new URLSearchParams(location.search).get("p") || ""; } catch (e) {} }
    return raw.replace(/[^A-Za-z0-9_-]/g, "").toUpperCase().slice(0, 16);
  }
  var code = getCode() || "WEB";
  function waLink(lang) {
    if (!WA_NUMBER) return WA_FALLBACK;
    return "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(MSG[lang].replace("{c}", code));
  }
  document.querySelectorAll("a.wa").forEach(function (a) { a.href = waLink("pt"); });
  if (WA_NUMBER) {
    var box = document.getElementById("lang");
    box.hidden = false;
    box.querySelectorAll("a").forEach(function (a) { a.href = waLink(a.dataset.l); });
  }

  // ===== Flujo video -> pantalla final =====
  var app = document.getElementById("app");
  var v = document.getElementById("video");
  var tap = document.getElementById("tap");
  var soundBtn = document.getElementById("sound");
  var soundTxt = document.getElementById("soundTxt");
  var wave = document.getElementById("wave");

  var startTimer;
  function finish() { app.classList.add("done"); try { v.pause(); } catch (e) {} }
  function start() {
    app.classList.remove("done");
    var p;
    try { v.currentTime = 0; p = v.play(); } catch (e) {}
    // Si en 8 s el video no arrancó (conexión lenta o bloqueo), pasamos a la pantalla final con el botón.
    clearTimeout(startTimer);
    startTimer = setTimeout(function () { if (!app.classList.contains("done") && v.currentTime < 0.5) finish(); }, 8000);
    if (p && p.then) {
      p.then(function () { tap.hidden = true; }).catch(function () { tap.hidden = false; });
    }
  }
  function syncSound() {
    soundTxt.textContent = v.muted ? "Som" : "Mudo";
    soundBtn.setAttribute("aria-label", v.muted ? "Activar sonido" : "Silenciar");
    wave.style.display = v.muted ? "none" : "";
  }

  v.addEventListener("ended", finish);
  v.addEventListener("error", finish);
  document.getElementById("skip").addEventListener("click", finish);
  document.getElementById("replay").addEventListener("click", start);
  document.getElementById("tapBtn").addEventListener("click", function () { v.muted = false; syncSound(); start(); });
  soundBtn.addEventListener("click", function () {
    v.muted = !v.muted; syncSound();
    if (v.paused && !app.classList.contains("done")) { try { v.play(); } catch (e) {} }
  });
  // Si el video no avanza (conexión lenta o bloqueo), no dejamos al turista esperando.
  var lastT = -1, stuck = 0;
  setInterval(function () {
    if (app.classList.contains("done") || !tap.hidden) return;
    if (v.currentTime === lastT) { stuck++; } else { stuck = 0; lastT = v.currentTime; }
    if (stuck >= 8) finish();
  }, 1000);

  syncSound();
  start();
})();
</script>
